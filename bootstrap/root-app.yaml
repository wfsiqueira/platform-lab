# Root app: o Argo CD lê platform/apps/ e cria uma Application por arquivo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-lab-root
  namespace: argocd
spec:
  project: platform-lab
  source:
    repoURL: https://github.com/wfsiqueira/platform-lab.git
    targetRevision: main
    path: platform/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
