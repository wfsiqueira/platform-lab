# Etapa 2: Collectors (agent DaemonSet + gateway Deployment). Depende dos CRDs do Operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collectors
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  project: platform-lab
  source:
    repoURL: https://github.com/wfsiqueira/platform-lab.git
    targetRevision: main
    path: platform/observability/otel
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
