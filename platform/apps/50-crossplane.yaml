# Etapa 4: Crossplane v2 transforma o cluster numa API de plataforma (XRDs + Compositions).
# No v2 a Composition compõe qualquer recurso do Kubernetes direto, então NÃO instalamos provider-kubernetes
# nem provider-helm: o CloudNativePG, o Namespace e o Application do Argo CD são compostos nativamente.
# O chart traz CRDs grandes: ServerSideApply evita o limite de annotation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: platform-lab
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.5.0
    helm:
      valuesObject:
        priorityClassName: lab-default
        metrics: { enabled: true }
        resourcesCrossplane:
          requests: { cpu: 50m, memory: 192Mi }
          limits: { cpu: 500m, memory: 768Mi }
        resourcesRBACManager:
          requests: { cpu: 25m, memory: 96Mi }
          limits: { cpu: 100m, memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-crossplane
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
