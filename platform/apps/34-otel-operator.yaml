# Etapa 2: OpenTelemetry Operator (CRDs OpenTelemetryCollector e Instrumentation).
# O certificado do webhook vem do cert-manager (já instalado no cluster).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  project: platform-lab
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.129.1
    helm:
      valuesObject:
        manager:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
        admissionWebhooks:
          certManager: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-observability
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle']
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
