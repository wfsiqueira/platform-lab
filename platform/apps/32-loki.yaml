# Etapa 2: Loki em SingleBinary, chunks e índice no Garage (bucket loki).
# Credenciais vêm do Secret loki-s3 (criado por platform/observability/garage/bootstrap.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: platform-lab
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.7.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          storage:
            type: s3
            bucketNames: { chunks: loki, ruler: loki, admin: loki }
            s3:
              endpoint: http://garage.lab-observability.svc:3900
              region: garage
              s3ForcePathStyle: true
              insecure: true
          limits_config:
            retention_period: 72h
          compactor:
            retention_enabled: true
            delete_request_store: s3
        singleBinary:
          replicas: 1
          priorityClassName: lab-default
          extraEnvFrom:
            - secretRef: { name: loki-s3 }
          persistence:
            enabled: true
            size: 5Gi
            storageClass: openebs-hostpath
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        gateway: { enabled: false }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        minio: { enabled: false }
        monitoring:
          serviceMonitor: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
