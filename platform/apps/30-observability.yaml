# Etapa 2, passo 1: Prometheus + Alertmanager + Grafana (kube-prometheus-stack).
# O Secret "grafana-admin" (admin-user, admin-password) NÃO está no git: criar com
# docs/estudo/passo-a-passo-etapa-2.md (Passo 1) antes do primeiro sync do Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform-lab
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.6.0
    helm:
      valuesObject:
        defaultRules:
          rules:
            # kubeadm expõe etcd, scheduler, controller-manager e kube-proxy só em 127.0.0.1.
            # Ficam desligados até o exercício de CKA que muda o bind-address (ver o guia).
            etcd: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeControllerManager: false
            kubeProxy: false
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }
        # O chart criaria um Service do CoreDNS em kube-system, que o AppProject do lab não permite
        # (o lab não escreve em kube-system). O ServiceMonitor abaixo lê o Service kube-dns existente.
        coreDns: { enabled: false }
        prometheusOperator:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        prometheus:
          additionalServiceMonitors:
            - name: coredns
              selector: { matchLabels: { k8s-app: kube-dns } }
              namespaceSelector: { matchNames: [kube-system] }
              endpoints:
                - port: metrics
                  interval: 30s
                  relabelings:
                    - { action: replace, targetLabel: job, replacement: coredns }   # os dashboards esperam job="coredns"
          prometheusSpec:
            priorityClassName: lab-default
            retention: 7d
            retentionSize: 8GB
            # Enxerga ServiceMonitors/PodMonitors/regras de qualquer release (Loki, Tempo, OTel).
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            # Exemplars (métrica -> trace) e remote_write receiver (Mimir/OTel no futuro).
            enableRemoteWriteReceiver: true
            enableFeatures: [exemplar-storage]
            resources:
              requests: { cpu: 200m, memory: 768Mi }
              limits: { memory: 1536Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: openebs-hostpath
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 10Gi } }
        alertmanager:
          alertmanagerSpec:
            priorityClassName: lab-default
            resources:
              requests: { cpu: 10m, memory: 48Mi }
              limits: { memory: 128Mi }
        grafana:
          priorityClassName: lab-default
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          defaultDashboardsTimezone: America/Sao_Paulo
          grafana.ini:
            server:
              domain: grafana.wsiqueira.cloud
              root_url: https://grafana.wsiqueira.cloud/
            users:
              allow_sign_up: false
            auth.anonymous:
              enabled: false
            security:
              cookie_secure: true
              cookie_samesite: lax
          deploymentStrategy: { type: Recreate }   # PVC local (ReadWriteOnce): sem rolling update
          persistence:
            enabled: true
            storageClassName: openebs-hostpath
            size: 2Gi
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 768Mi }  # 384Mi estourava (OOMKilled) com os dashboards novos
          # Métrica -> trace: exemplars do Prometheus apontam para o Tempo.
          sidecar:
            datasources:
              exemplarTraceIdDestinations:
                datasourceUid: tempo
                traceIdLabelName: traceID
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.lab-observability.svc:3100
              jsonData:
                # Log -> trace: campo trace_id (ou traceID) vira link para o Tempo.
                derivedFields:
                  - name: trace_id
                    matcherRegex: '"?trace_?[iI][dD]"?[=:]\s*"?(\w+)'
                    url: '$${__value.raw}'
                    datasourceUid: tempo
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.lab-observability.svc:3200
              jsonData:
                # Trace -> logs e trace -> métricas; service graph vem do metrics-generator.
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                  filterByTraceID: true
                  filterBySpanID: false
                  tags:
                    - { key: service.name, value: service_name }
                tracesToMetrics:
                  datasourceUid: prometheus
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph: { enabled: true }
                lokiSearch:
                  datasourceUid: loki
        kube-state-metrics:
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
        prometheus-node-exporter:
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-observability
  ignoreDifferences:
    # O operador injeta o caBundle nos webhooks; sem isto o Argo CD mostra OutOfSync para sempre.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - ServerSideApply=true      # CRDs do Prometheus Operator são grandes demais para client-side
      - RespectIgnoreDifferences=true
