# Pedido de um ambiente completo: namespace lab-exemplo com quota, NetworkPolicy, Postgres (CloudNativePG)
# e um Application do Argo CD que sincroniza platform/exemplo-app.
apiVersion: platform.wsiqueira.cloud/v1alpha1
kind: AppEnvironment
metadata:
  name: exemplo
spec:
  tier: small
  database:
    size: small
  gitops:
    repoURL: https://github.com/wfsiqueira/platform-lab.git
    path: platform/exemplo-app
