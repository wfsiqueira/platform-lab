apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, labels: { app.kubernetes.io/name: worker } }
spec:
  # replicas: gerido pelo KEDA (platform/autoscaling)
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "lab-python"
        instrumentation.opentelemetry.io/container-names: "worker"
    spec:
      priorityClassName: lab-default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: deps
          image: python:3.12-slim
          command: ["pip", "install", "--no-cache-dir", "--target", "/deps", "-r", "/app/requirements.txt"]
          env: [{ name: HOME, value: /tmp }]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: deps, mountPath: /deps }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: worker
          image: python:3.12-slim
          command: ["python","/app/worker.py"]
          env:
            - { name: OTEL_SERVICE_NAME, value: worker }
            - { name: PYTHONPATH, value: /deps:/app }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS, value: redis }  # evita um span BLPOP a cada 5 s

          resources:
            requests: { cpu: 50m, memory: 80Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: deps, mountPath: /deps, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app
          configMap: { name: pipeline-code }
        - name: deps
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
