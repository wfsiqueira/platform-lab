# Namespaces do laboratório com teto de recursos. Ajuste os números depois do preflight.
# Total reservado para o lab: ~6 vCPU e ~16 GiB de limite, deixando folga para o homelab.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-demo
  labels:
    platform-lab/tier: lab
    gateway-access: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: lab-demo
spec:
  hard:
    # Etapa 3: o KEDA escala worker (até 6) e api (até 3); o k6 roda como Job no mesmo namespace.
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "30"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: lab-demo
spec:
  limits:
    - type: Container
      default:          # limite aplicado quando o container não declara
        memory: 256Mi
      defaultRequest:   # request aplicado quando o container não declara
        cpu: 25m
        memory: 64Mi
      max:
        memory: 2Gi
# O namespace "argocd" NÃO é gerido aqui: com prune ligado, um erro neste arquivo
# apagaria o namespace inteiro (o Argo CD e as Applications do baseplus junto).
# O label gateway-access=true é aplicado pelo bootstrap/install-argocd.sh.
---
# Etapa 2: observabilidade (Prometheus, Grafana, Loki, Tempo, Garage, OTel).
# Orçamento: ~3 vCPU de request e 8 GiB de limite, dentro do teto de ~16 GiB do lab.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-observability
  labels:
    platform-lab/tier: lab
    gateway-access: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: lab-observability
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 5Gi
    limits.memory: 10Gi
    pods: "50"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: lab-observability
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        memory: 2Gi
---
# Etapa 3: KEDA (operator, metrics apiserver e admission webhooks).
# Orçamento: ~0,5 vCPU de request e 2 GiB de limite; o total do lab continua em ~16 GiB de limite.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-keda
  labels:
    platform-lab/tier: lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: lab-keda
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: lab-keda
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        memory: 1Gi
---
# Etapa 4: Crossplane (core, rbac-manager e pods das Composition Functions).
# Orçamento: ~0,5 vCPU de request e ~2 GiB de limite. Os ambientes criados pelo AppEnvironment (lab-<nome>)
# têm quota própria, definida pela Composition.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-crossplane
  labels:
    platform-lab/tier: lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: lab-crossplane
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1536Mi
    limits.memory: 3Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: lab-crossplane
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        memory: 1536Mi
