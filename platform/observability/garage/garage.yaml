# Garage (S3 compatível) para Loki e Tempo. Nó único, replication_factor 1.
# Secret "garage-secrets" (rpc-secret, admin-token) NÃO está no git: ver bootstrap.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: lab-observability
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: lab-observability
  labels: { app.kubernetes.io/name: garage }
spec:
  selector: { app.kubernetes.io/name: garage }
  ports:
    - { name: s3, port: 3900, targetPort: 3900 }
    - { name: admin, port: 3903, targetPort: 3903 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: lab-observability
  labels: { app.kubernetes.io/name: garage }
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: garage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: garage }
    spec:
      priorityClassName: lab-default
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          command: ["/garage", "server"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-secrets, key: rpc-secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-secrets, key: admin-token } }
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          readinessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: admin }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml }
            - { name: meta, mountPath: /var/lib/garage/meta }
            - { name: data, mountPath: /var/lib/garage/data }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    - metadata: { name: meta }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath
        resources: { requests: { storage: 1Gi } }
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath
        resources: { requests: { storage: 10Gi } }
